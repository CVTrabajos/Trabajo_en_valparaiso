name: Actualizar Ofertas Valparaíso

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar ofertas desde Google Sheets
        run: |
          curl -sL "https://script.google.com/macros/s/AKfycbwYU-GCp88P5yuh7AIkiZPpJpLji02jpru4yKuJbgBeXTK31azB0bUcHFplie6Lp9N1XQ/exec" -o ofertas_temp.json
          if grep -q '"cargo"' ofertas_temp.json; then
            mv ofertas_temp.json ofertas.json
          else
            echo "Error: respuesta inválida desde Apps Script"
            cat ofertas_temp.json
            exit 1
          fi

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --staged --quiet || git commit -m "Actualizar ofertas.json Valparaíso"
          git push
